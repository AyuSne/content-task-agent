name: checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.11'
      - run: python -m pip install uv==0.9.27
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
