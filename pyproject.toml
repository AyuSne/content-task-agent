[project]
name = "content-task-agent"
version = "0.1.0"
description = "内容任务规划 Agent：为虚构视频剪辑 App 的短视频推广活动准备有依据、可核验、可续跑的内容活动方案"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.23,<1",
    "openai>=1.40,<3",
]

[project.scripts]
cta = "cta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: real DeepSeek API runs (skipped unless --live is passed)",
    "slow: longer running acceptance checks",
]
